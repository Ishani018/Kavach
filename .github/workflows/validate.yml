name: Kavach validation (Tier A + Tier B)

# Tier A + Tier B on push/PR to both kavach-rearch and navigator-rearch.
# Latency checks are SKIPPED in cloud CI (shared, variable-performance
# runners have no meaningful "local reference" to compare latency
# against -- see VALIDATION_PROTOCOL.md's Tier C description). The full
# 544-case InjecAgent replay (Tier C) is also NOT run here -- too slow
# for a per-push cloud job; run it locally via `python validate.py
# --tier C` before a release or when detection logic changes
# significantly.
#
# WHAT THIS WORKFLOW ACTUALLY COVERS, EXPLICITLY (see VALIDATION_PROTOCOL.md
# for the full picture):
#   - Tier A: parliament/test_channel_taint.py (13 tests) +
#     parliament/test_speaker.py (12 tests)
#   - Tier B: sampled replay (--sample-size 50) of VAULT/EXECUTOR's
#     56-case benign set + all 8 AgentDojo attack cases + all 22 real
#     benign sessions, against locked_baseline.json
# WHAT IT DOES NOT COVER:
#   - Full 544-case InjecAgent replay (Tier C only, run locally)
#   - Any of NAVIGATOR's three baseline numbers (43/43, 32/32, 0/29) --
#     these are navigator-rearch-only reference values; the mechanism
#     they test does not exist on kavach-rearch and this workflow does
#     not check them out from navigator-rearch to test them either.
#   - Absolute latency (relative-only, and only in Tier C, not run here)
#   - Cross-branch PRs additionally run the CHANNEL<->NAVIGATOR interface
#     contract test (test_provenance_record_schema_frozen), since that's
#     the one contract both branches must honor regardless of divergence.

on:
  push:
    branches: [kavach-rearch, navigator-rearch]
  pull_request:
    branches: [kavach-rearch, navigator-rearch]

jobs:
  tier-a:
    name: Tier A (unit suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Tier A
        run: python validate.py --tier A -q

  tier-b:
    name: Tier B (sampled replay census)
    runs-on: ubuntu-latest
    needs: tier-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load corpus into ChromaDB
        run: python corpus_loader.py --corpus kavach_corpus_v1.json --rebuild
      - name: Calibrate COMPASS thresholds
        run: python compass_calibrator.py
      - name: Start Kavach parliament server
        run: |
          nohup python -m uvicorn parliament.server:app --host 127.0.0.1 --port 8088 > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8088/health > /dev/null; then
              echo "Server healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1
      - name: Run Tier B (concurrency=4, Linux runner -- no Windows ProactorEventLoop issue)
        run: python validate.py --tier B --concurrency 4 -q
      - name: Show server log on failure
        if: failure()
        run: cat server.log
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  interface-contract:
    name: CHANNEL<->NAVIGATOR interface contract (cross-branch PRs only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run frozen ProvenanceRecord schema test
        run: python -m parliament.test_channel_taint
